<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="元郁 YY">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#1F3A1A"/>
      <stop offset="55%" stop-color="#376130"/>
      <stop offset="100%" stop-color="#49813C"/>
    </linearGradient>
  </defs>

  <!-- Forest green gradient background -->
  <rect width="100" height="100" fill="url(#bg)"/>

  <!-- Decorative cream swooshes (top-left + bottom-right) -->
  <g stroke="#E0E7D7" stroke-linecap="round" fill="none">
    <path d="M 7 18 Q 17 8 30 13" stroke-width="1.6" opacity="0.85"/>
    <path d="M 4 27 Q 11 23 19 24" stroke-width="0.9" opacity="0.5"/>
    <path d="M 70 86 Q 80 94 92 84" stroke-width="1.6" opacity="0.85"/>
    <path d="M 80 76 Q 86 78 94 74" stroke-width="0.9" opacity="0.5"/>
  </g>

  <!-- Back Y (blue), right side, offset down-right -->
  <g transform="translate(2.5, 3)">
    <!-- yellow/olive 3D rim (wider) -->
    <g stroke="#9C9D70" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 40 22 L 58 50 L 76 22"/>
      <path d="M 58 50 L 58 80"/>
    </g>
    <!-- blue Y on top -->
    <g stroke="#5A6393" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 40 22 L 58 50 L 76 22"/>
      <path d="M 58 50 L 58 80"/>
    </g>
  </g>

  <!-- Front Y (orange), left side, slightly up-left -->
  <g transform="translate(-1.5, -1)">
    <!-- yellow/olive 3D rim -->
    <g stroke="#9C9D70" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 18 22 L 36 50 L 54 22"/>
      <path d="M 36 50 L 36 80"/>
    </g>
    <!-- orange/rust Y on top -->
    <g stroke="#C36237" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 18 22 L 36 50 L 54 22"/>
      <path d="M 36 50 L 36 80"/>
    </g>
  </g>
</svg>
