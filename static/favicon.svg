<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="永昱 LED">
  <defs>
    <radialGradient id="ledGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#FFE89A" stop-opacity="1"/>
      <stop offset="35%" stop-color="#F5C842" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#F5C842" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded dark background (iOS-friendly) -->
  <rect width="64" height="64" rx="14" fill="#1A1815"/>

  <!-- Y letterform: two diagonals + stem -->
  <g stroke="#F5C842" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 14 14 L 32 32"/>
    <path d="M 50 14 L 32 32"/>
    <path d="M 32 32 L 32 52"/>
  </g>

  <!-- LED glow + bright filament dot at the junction -->
  <circle cx="32" cy="32" r="11" fill="url(#ledGlow)"/>
  <circle cx="32" cy="32" r="3.5" fill="#FFF4D2"/>
</svg>
