{{ define "main" }}
<section class="py-12 sm:py-16">
  <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
    <header class="mb-10 pb-6 border-b border-white/5">
      <h1 class="text-4xl sm:text-5xl font-bold text-ink mb-3">{{ .Title }}</h1>
      {{ with .Description }}<p class="text-ink/60 text-lg">{{ . }}</p>{{ end }}
    </header>

    <article class="prose prose-invert
                    prose-headings:text-ink prose-headings:font-bold prose-headings:scroll-mt-24
                    prose-h1:text-3xl prose-h2:text-2xl prose-h2:mt-12 prose-h2:mb-4
                    prose-h3:text-xl prose-h3:mt-8 prose-h3:mb-3
                    prose-p:text-ink/85 prose-p:leading-relaxed prose-p:my-5
                    prose-a:text-accent prose-a:font-medium prose-a:no-underline hover:prose-a:underline
                    prose-strong:text-ink prose-strong:font-semibold
                    prose-li:text-ink/85 prose-li:my-1
                    prose-ul:my-4 prose-ol:my-4
                    prose-img:rounded-xl prose-img:border prose-img:border-white/10 prose-img:my-8
                    prose-code:text-accent prose-code:bg-base prose-code:px-1.5 prose-code:py-0.5 prose-code:rounded prose-code:before:hidden prose-code:after:hidden
                    prose-pre:bg-base prose-pre:border prose-pre:border-white/10
                    prose-blockquote:border-l-accent prose-blockquote:text-ink/70 prose-blockquote:not-italic
                    prose-hr:border-white/10 prose-hr:my-10
                    prose-table:border-collapse
                    prose-th:text-left prose-th:text-ink prose-th:font-semibold
                    prose-td:text-ink/80">
      {{ .Content }}
    </article>
  </div>
</section>
{{ end }}
