<nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
  <a href="/" class="flex items-baseline gap-1.5 group">
    <span class="font-bold text-xl text-ink tracking-wide group-hover:text-accent transition-colors">元郁</span>
    <span class="hidden sm:inline text-[10px] text-muted tracking-[0.2em] uppercase">Yuan Yu</span>
  </a>

  {{/* Desktop menu */}}
  <ul class="hidden md:flex items-center gap-1">
    {{ $current := . }}
    {{ range site.Menus.main }}
    <li>
      <a href="{{ .URL }}" class="px-3 py-2 rounded-md text-sm font-medium hover:bg-white/5 transition-colors {{ if $current.IsMenuCurrent "main" . }}text-accent{{ else }}text-ink/80 hover:text-ink{{ end }}">
        {{ .Name }}
      </a>
    </li>
    {{ end }}
  </ul>

  {{/* Mobile menu button */}}
  <button id="mobile-menu-btn" type="button" class="md:hidden p-2 rounded-md hover:bg-white/5" aria-label="開啟選單">
    <svg id="icon-menu" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    <svg id="icon-close" class="w-6 h-6 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>
</nav>

{{/* Mobile menu drawer */}}
<div id="mobile-menu" class="hidden md:hidden border-t border-white/5 bg-base/95 backdrop-blur">
  <ul class="max-w-7xl mx-auto px-4 py-4 space-y-1">
    {{ range site.Menus.main }}
    <li>
      <a href="{{ .URL }}" class="block px-3 py-3 rounded-md text-base font-medium hover:bg-white/5">
        {{ .Name }}
      </a>
    </li>
    {{ end }}
  </ul>
</div>

<script>
  document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
    const m = document.getElementById('mobile-menu');
    const im = document.getElementById('icon-menu');
    const ic = document.getElementById('icon-close');
    m.classList.toggle('hidden');
    im.classList.toggle('hidden');
    ic.classList.toggle('hidden');
  });
</script>
